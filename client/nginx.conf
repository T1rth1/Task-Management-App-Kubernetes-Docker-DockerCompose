server {
    listen 80;  
    # Nginx will listen for incoming HTTP requests on port 80

    # Frontend (React App)
    location / {
        root /usr/share/nginx/html;  
        # This is the directory inside the container where your built React (Vite) files are stored

        index index.html;  
        # Default file to serve when someone hits "/"

        try_files $uri $uri/ /index.html;  
        # 1. Check if requested file exists (e.g., /logo.png)
        # 2. Check if it's a directory
        # 3. If not found → fallback to index.html
        # This is REQUIRED for React Router (SPA routing)
    }

    # Backend API Proxy
    location /api/ {
        # Matches all requests starting with /api/
        # Example:
        # /api/user/login
        # /api/task/create
        # here i already made the routes starting from the /api/.. so no need to change anything for backend routes and frontend routes api request to the backend...

        # proxy_pass http://host.docker.internal:5000;
        # this works when we want to test the frontend while we are in the dockerfile stage...and we are not using the docker compose at all
        # Forward request to backend running on host machine (port 5000)
        # Works when backend is exposed to browser using the command "docker run -p 5000:5000..." and frontend runs in Docker only not in docker compose
        
        proxy_pass http://backend:5000;  
        # Forward request to backend container
        # "backend" refers to the Docker service name defined in docker-compose.yml
        # This works ONLY when both frontend and backend are part of the same Docker Compose setup (shared network)
        # If not using Docker Compose or not on the same network, this hostname will not resolve
        # Port 5000 = your Node.js backend server

        proxy_set_header Host $host;  
        # Pass original host (domain) to backend
        # Useful for logging and domain-based logic

        proxy_set_header X-Real-IP $remote_addr;  
        # Sends the real client IP to backend
        # Without this, backend only sees Nginx IP

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  
        # Keeps track of full request chain (client → proxy → backend)
        # Important for logging, analytics, rate limiting

        proxy_set_header X-Forwarded-Proto $scheme;  
        # Tells backend whether request was HTTP or HTTPS
        # Useful when you add SSL later

        proxy_http_version 1.1;  
        # Required for modern connections (keep-alive, WebSockets)

        proxy_set_header Upgrade $http_upgrade;  
        # Allows protocol upgrade (used in WebSockets)

        proxy_set_header Connection "upgrade";  
        # Ensures WebSocket connections work properly
    }

    # =========================
    # Health Check Endpoint
    # =========================
    location /health {
        return 200 'OK';  
        # Always returns HTTP 200 with "OK"
        # Useful for Docker / Kubernetes health checks

        add_header Content-Type text/plain;  
        # Sets response type as plain text
    }
}