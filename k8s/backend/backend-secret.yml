apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: task-app
type: Opaque
stringData:
  JWT_SECRET: youcantfakeexperiencefirstyears


# kind: Secret
# -> Defines this object as a Secret
# -> Used to store sensitive data like passwords, tokens, API keys

# metadata:
# -> Basic identity of the Secret object

#   name: backend-secret
#   -> Name of the Secret
#   -> Your backend will reference this name to access JWT_SECRET

#   namespace: task-app
#   -> Secret is scoped inside "task-app" namespace
#   -> Only pods in this namespace can use it (unless shared explicitly)

# type: Opaque
# -> Generic Secret type
# -> Means Kubernetes does NOT interpret the content
# -> Most commonly used type for custom secrets

# stringData:
# -> Human-readable way to define secret values
# -> Kubernetes automatically converts this into base64 internally
# -> Easier than manually encoding values in "data"

#   JWT_SECRET: youcantfakeexperiencefirstyears
#   -> This is your secret key used for JWT token signing
#   -> Used by backend to:
#        - sign tokens
#        - verify tokens
#        - prevent tampering

# SECURITY NOTE:
# -> This value should NEVER be exposed in ConfigMap
# -> Should NEVER be committed in public repos
# -> In production, use AWS Secrets Manager / Vault instead