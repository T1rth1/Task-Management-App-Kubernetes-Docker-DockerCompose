apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: task-manager-ingress

#################### Ingress Controller in detailed explain in the notes of this project #####################
  annotations:
    # This tells Nginx how to rewrite incoming URLs
    # Example:
    # /api/login → /login (if needed)
    nginx.ingress.kubernetes.io/rewrite-target: /

spec:
  # This tells Kubernetes to use Nginx Ingress Controller
  ingressClassName: nginx

  rules:
    - host: taskmanager.local   # Domain name (mapped in /etc/hosts)
    # why we are using this here detailed explanation is there in the one notes

      http:
        paths:

          
          # FRONTEND ROUTING
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend   # frontend service name
                port:
                  number: 80     # frontend runs on port 80 (nginx)

          # BACKEND ROUTING
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend    # backend service
                port:
                  number: 5000   # backend Node.js port